<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Gấu Bông Tương Tác 3D</title>
    <!-- Nạp Fonts chữ lãng mạn và hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Palette màu Pastel Lãng mạn, sang trọng */
            --bg-gradient-1: #fdfbfb;
            --bg-gradient-2: #ffe4e1; /* Misty Rose */
            
            --card-front-bg: #fff0f5; /* Lavender Blush */
            --card-inner-bg: #fffdfa; /* Creamy White */
            --card-back-bg: #ffe4e1;
            
            --text-dark: #4a3b32;
            --text-highlight: #d81b60; /* Pinkish Red */
            --border-color: #e8d0ce;
            
            /* Màu Gấu Bông */
            --teddy-brown: #d2b48c;
            --teddy-light: #ffebd2;
            --teddy-outline: #5c4033;
            --heart-red: #ff4d6d;
            
            /* Kích thước thẻ */
            /* Kích thước thiệp tự co theo màn hình */
            --card-width: min(350px, 42vw, 70vh);
            --card-height: min(500px, 71.43vw, 100vh);
            --transition-time: 1.2s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Nền chuyển màu nhẹ nhàng */
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            overflow: hidden;
            color: var(--text-dark);
            width: 100%;
            box-sizing: border-box;
        }

        .scene {
            width: 100%;
            width: 100%;
            height: min(78vh, 700px);
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2500px; /* Tạo độ sâu 3D */
            position: relative;
            z-index: 10;
        }

        .book-wrapper {
            position: relative;
            width: calc(var(--card-width) * 2); /* Tổng chiều rộng 2 trang khi mở */
            height: var(--card-height);
            transform-style: preserve-3d;
            /* Mặc định ở Trang 1 (Bìa): Đẩy container sang trái để bìa căn giữa màn hình */
            transform: translateX(-25%);
            transition: transform var(--transition-time) cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        /* Các trạng thái căn giữa của quyển sách */
        .book-wrapper.state-1 { transform: translateX(0); }       /* Mở ra: Bìa trái, Nội dung phải -> Căn giữa 0 */
        .book-wrapper.state-2 { transform: translateX(25%); }     /* Đóng lại mặt sau: Đẩy sang phải để mặt sau căn giữa */

        .page {
            position: absolute;
            right: 0; /* Neo trang vào nửa phải của container */
            width: 50%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center; /* Điểm xoay ở gáy sách (cạnh trái của trang) */
            transition: transform var(--transition-time) cubic-bezier(0.645, 0.045, 0.355, 1), z-index 0.5s;
            border-radius: 20px;
        }

        /* Định dạng 2 mặt của mỗi trang giấy */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Giấu mặt sau khi bị lật ngược */
            border-radius: 15px;
            overflow: hidden;
            background-color: var(--card-inner-bg);
            /* Viền bo mềm mại và bóng đổ 3D */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02), 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Mặt sau của tờ giấy phải được lật 180 độ mặc định */
        .face.back {
            transform: rotateY(180deg);
        }

        #page1 { z-index: 2; } /* Bìa ngoài nằm trên */
        #page2 { z-index: 1; } /* Mặt trong nằm dưới */

        /* Hiệu ứng bóng gáy sách tạo chiều sâu */
        .spine-shadow {
            position: absolute;
            top: 0; bottom: 0; width: 40px;
            pointer-events: none;
            z-index: 10;
        }
        .spine-left { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.12), transparent); }
        .spine-right { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.12), transparent); }

        /* Trạng thái lật trang */
        .flipped {
            transform: rotateY(-180deg);
        }

        /* Cập nhật Z-index khi lật để các trang không đè sai lớp */
        #page1.flipped { z-index: 1; }
        #page2.flipped { z-index: 2; }

        .front-cover {
            cursor: pointer;
            background-color: var(--card-front-bg);
            background-image: 
                linear-gradient(rgba(255,255,255,0.6) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255,255,255,0.6) 2px, transparent 2px);
            background-size: 25px 25px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 2px solid rgba(255,255,255,0.8);
        }

        .envelope-wrapper {
            position: relative;
            animation: floatUp 3s ease-in-out infinite;
            filter: drop-shadow(0 15px 15px rgba(216, 27, 96, 0.15));
            margin-bottom: 30px;
        }

        @keyframes floatUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .open-me-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--text-highlight);
            text-shadow: 2px 2px 0 #fff;
            margin-top: 15px;
        }

        .inner-left {
            padding: 30px;
            background-color: var(--card-inner-bg);
            background-image: radial-gradient(circle at 50% 50%, rgba(216, 27, 96, 0.03) 0%, transparent 60%);
        }

        .message-container {
            height: 100%;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 25px;
            display: flex; flex-direction: column; justify-content: space-between;
            position: relative;
            background: rgba(255,255,255,0.8);
        }

        .recipient {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: var(--text-dark);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .message-body {
            font-size: 1.3rem; line-height: 1.8; font-weight: 700; text-align: center;
            background: #fff; padding: 25px 20px; border-radius: 15px;
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.05);
            position: relative; margin: auto 0;
        }
        .message-body::before, .message-body::after {
            content: '"'; font-family: Georgia, serif; font-size: 4rem;
            color: rgba(216, 27, 96, 0.15); position: absolute;
        }
        .message-body::before { top: -5px; left: 10px; }
        .message-body::after { bottom: -35px; right: 10px; }

        .sender { text-align: right; font-family: 'Dancing Script', cursive; font-size: 2rem; color: var(--text-highlight); font-weight: bold; }

        /* Băng dính trang trí */
        .washi-tape { position: absolute; width: 45px; height: 16px; z-index: 10; box-shadow: 1px 1px 3px rgba(0,0,0,0.1); }
        .wt-1 { top: -8px; left: 20px; transform: rotate(-12deg); background-color: rgba(255, 182, 193, 0.8); }
        .wt-2 { bottom: -8px; right: 20px; transform: rotate(-15deg); background-color: rgba(173, 216, 230, 0.8); }

        .inner-right { padding: 30px; background-color: var(--card-inner-bg); }
        
        .teddy-scene {
            height: 100%; border: 2px dashed var(--border-color); border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden; background: rgba(255,255,255,0.8);
        }

        .cloud-bg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(255, 228, 225, 0.6) 0%, transparent 70%);
            border-radius: 50%; z-index: 0;
        }

        .teddy-wrapper { position: relative; z-index: 2; animation: bounce 4s ease-in-out infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .love-text { font-family: 'Dancing Script', cursive; font-size: 3.2rem; color: var(--text-dark); margin-top: 15px; z-index: 2; line-height: 1; }
        .love-subtext { font-size: 1rem; text-transform: uppercase; letter-spacing: 4px; color: #a1887f; margin-top: 8px; z-index: 2; font-weight: bold; }

        .back-cover {
            background-color: var(--card-back-bg);
            background-image: 
                linear-gradient(rgba(255,255,255,0.6) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255,255,255,0.6) 2px, transparent 2px);
            background-size: 25px 25px;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid rgba(255,255,255,0.8);
        }

        .handmade-badge { text-align: center; opacity: 0.8; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.05)); }
        .handmade-badge svg { margin-bottom: 15px; }
        .handmade-badge p { font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; font-weight: 900; color: var(--text-dark); }

        .controls-container {
            position: relative;
            z-index: 20;
            margin-top: 40px;
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            backdrop-filter: blur(5px);
        }

        .btn-page {
            background: #fff;
            color: var(--text-highlight);
            border: 2px solid #fff;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.1);
        }

        .btn-page:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(216, 27, 96, 0.2);
            border-color: var(--card-back-bg);
        }

        .btn-page:active:not(:disabled) { transform: translateY(1px); }

        .btn-page:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            color: #999;
            box-shadow: none;
        }

        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .intro-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .intro-content {
            text-align: center;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            padding: 20px;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .intro-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--text-highlight);
            margin: 20px 0 40px;
            text-shadow: 2px 2px 0 #fff;
            line-height: 1.3;
        }

        .btn-start {
            background: var(--text-highlight);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(216, 27, 96, 0.3);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-start:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 25px rgba(216, 27, 96, 0.4);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(216, 27, 96, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(216, 27, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(216, 27, 96, 0); }
        }

        /* Container chứa thiệp (ẩn lúc đầu) */
        .main-content {
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            transition: opacity 1s ease 0.3s, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute; 
            height: 100%;
            pointer-events: none; /* Khóa tương tác khi chưa hiện */
        }

        .main-content.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto; /* Mở khóa tương tác */
        }



        /* Trái tim hồng bay nhẹ trên tất cả các page */
        .page-hearts {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 8;
            border-radius: 15px;
        }

        .page-heart {
            position: absolute;
            bottom: -35px;
            left: var(--x);
            color: #ff8fb1;
            font-size: var(--size);
            font-weight: 900;
            font-weight: 900;
            opacity: 0;
            animation: pageHeartFloat var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            filter: drop-shadow(0 4px 6px rgba(216, 27, 96, 0.24));
        }

        @keyframes pageHeartFloat {
            0% {
                transform: translate3d(0, 0, 0) rotate(-8deg) scale(.65);
                opacity: 0;
            }
            15% {
                opacity: .7;
            }
            50% {
                transform: translate3d(var(--drift), -260px, 0) rotate(10deg) scale(1);
                opacity: .8;
            }
            100% {
                transform: translate3d(calc(var(--drift) * -0.7), -580px, 0) rotate(-12deg) scale(.7);
                opacity: 0;
            }
        }

        /* Hiệu ứng trái tim động ở trang cuối */
        .heart-finale {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 3;
        }

        .floating-heart {
            position: absolute;
            bottom: -40px;
            left: var(--x);
            font-size: var(--size);
            opacity: 0;
            animation: heartFloat var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            filter: drop-shadow(0 4px 5px rgba(216, 27, 96, 0.18));
        }

        @keyframes heartFloat {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.7);
                opacity: 0;
            }
            12% {
                opacity: 0.85;
            }
            50% {
                transform: translateY(-240px) translateX(25px) rotate(12deg) scale(1);
                opacity: 0.9;
            }
            100% {
                transform: translateY(-560px) translateX(-35px) rotate(-15deg) scale(0.75);
                opacity: 0;
            }
        }

        /* Có thể click toàn bộ trang cuối để quay lại nội dung */
        .finale-click {
            cursor: pointer;
        }


        /* ===== FIX CĂN CHỮ RESPONSIVE ===== */
        .face {
            min-width: 0;
        }

        .inner-left,
        .inner-right,
        .front-cover,
        .back-cover {
            min-width: 0;
            min-height: 0;
        }

        .message-container,
        .teddy-scene {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
        }

        .recipient {
            width: 100%;
            text-align: center;
            white-space: normal;
            overflow-wrap: anywhere;
            line-height: 1.2;
        }

        .message-body {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            text-align: center;
            overflow-wrap: anywhere;
            word-break: normal;
            hyphens: auto;
        }

        .sender {
            width: 100%;
            text-align: right;
            overflow-wrap: anywhere;
            line-height: 1.2;
        }

        .open-me-text,
        .love-text,
        .love-subtext,
        .handmade-badge,
        .handmade-badge p {
            max-width: 100%;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* Không cho chữ làm thay đổi kích thước trang */
        .front-cover,
        .back-cover {
            padding-left: clamp(10px, 4vw, 30px);
            padding-right: clamp(10px, 4vw, 30px);
        }

        /* ===== RESPONSIVE: PC / TABLET / ĐIỆN THOẠI ===== */
        @media (max-width: 800px) {
            :root {
                --card-width: min(350px, 43vw, 68vh);
                --card-height: min(500px, 61vw, 97vh);
            }

            .scene {
                height: min(76vh, 650px);
                perspective: 1800px;
            }

            .controls-container {
                margin-top: 12px;
                gap: 10px;
                padding: 8px 12px;
                max-width: 94vw;
            }

            .btn-page {
                padding: 10px 16px;
                font-size: 1rem;
            }

            .intro-text {
                font-size: clamp(2rem, 7vw, 2.8rem);
            }
        }

        @media (max-width: 600px) {
            .open-me-text {
                font-size: clamp(1.15rem, 6vw, 2.4rem);
                line-height: 1.05;
                margin-top: 8px;
            }

            .recipient {
                font-size: clamp(.85rem, 4.3vw, 1.6rem);
                padding-bottom: 5px;
            }

            .message-body {
                font-size: clamp(.68rem, 3.15vw, 1.15rem);
                line-height: 1.35;
                letter-spacing: 0;
            }

            .sender {
                font-size: clamp(.9rem, 4vw, 1.5rem);
            }

            :root {
                /* 1 trang chiếm khoảng 43vw => 2 trang vừa màn hình */
                --card-width: min(350px, 43vw);
                --card-height: calc(var(--card-width) * 1.42857);
            }

            body {
                min-height: 100dvh;
            }

            .main-content {
                height: 100dvh;
            }

            .scene {
                height: auto;
                width: 100vw;
                flex: 0 0 auto;
            }

            .book-wrapper {
                max-width: 100vw;
            }

            .inner-left,
            .inner-right {
                padding: clamp(10px, 3vw, 30px);
            }

            .message-container {
                padding: clamp(10px, 3vw, 25px);
            }

            .recipient {
                font-size: clamp(1.2rem, 5vw, 2.2rem);
            }

            .message-body {
                font-size: clamp(.75rem, 3.2vw, 1.3rem);
                line-height: 1.45;
                padding: clamp(10px, 3vw, 25px) clamp(8px, 2.5vw, 20px);
            }

            .sender {
                font-size: clamp(1.2rem, 5vw, 2rem);
            }

            .love-text {
                font-size: clamp(1.7rem, 7vw, 3.2rem);
            }

            .love-subtext {
                font-size: clamp(.55rem, 2.5vw, 1rem);
                letter-spacing: clamp(1px, 1vw, 4px);
            }

            .controls-container {
                margin-top: 8px;
                gap: 6px;
                padding: 6px 8px;
            }

            .btn-page {
                padding: 8px 12px;
                font-size: clamp(.75rem, 3.5vw, 1rem);
                gap: 4px;
            }

            .intro-content {
                padding: 16px;
                max-width: 95vw;
            }

            .intro-text {
                font-size: clamp(1.7rem, 8vw, 2.4rem);
                margin: 16px 0 28px;
            }

            .btn-start {
                font-size: clamp(1rem, 5vw, 1.3rem);
                padding: 12px 28px;
            }

            .envelope-wrapper svg {
                max-width: 34vw;
                height: auto;
            }

            .teddy-wrapper svg {
                width: min(160px, 32vw);
                height: auto;
            }

            .cloud-bg {
                width: min(250px, 55vw);
                height: min(250px, 55vw);
            }

            .handmade-badge svg {
                width: min(80px, 18vw);
                height: auto;
            }

            .handmade-badge p {
                font-size: clamp(.65rem, 2.8vw, 1rem);
                letter-spacing: clamp(1px, .8vw, 3px);
            }
        }

        @media (max-width: 380px) {
            :root {
                --card-width: 43vw;
                --card-height: calc(var(--card-width) * 1.42857);
            }

            .btn-page {
                padding: 7px 9px;
            }

            .controls-container {
                gap: 4px;
            }
        }

        /* Điện thoại nằm ngang */
        @media (max-height: 600px) and (orientation: landscape) {
            :root {
                --card-height: 78vh;
                --card-width: calc(var(--card-height) * .7);
            }

            .scene {
                height: 82vh;
            }

            .controls-container {
                margin-top: 4px;
            }

            .intro-text {
                font-size: clamp(1.4rem, 5vh, 2.4rem);
                margin: 10px 0 18px;
            }

            .intro-content {
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="intro-screen" id="introScreen">
        <div class="intro-content">
            <div class="envelope-wrapper" style="margin-bottom: 0;">
                <svg width="150" height="150" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="12,47 50,17 88,47 88,87 12,87" fill="rgba(0,0,0,0.05)"/>
                    <rect x="15" y="15" width="70" height="50" fill="#ffffff" rx="3" stroke="#e8d0ce" stroke-width="1"/>

    <script>
        // Cấu hình các element
        const bookWrapper = document.getElementById('bookWrapper');
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        let currentState = 0;

        function updateUI() {
            // Cập nhật trạng thái class trên Container để căn giữa tự động
            bookWrapper.className = 'book-wrapper'; 
            if (currentState === 1) bookWrapper.classList.add('state-1');
            if (currentState === 2) bookWrapper.classList.add('state-2');

            // Điều khiển lật từng trang
            if (currentState === 0) {
                page1.classList.remove('flipped');
                page2.classList.remove('flipped');
            } else if (currentState === 1) {
                page1.classList.add('flipped');
                page2.classList.remove('flipped');
            } else if (currentState === 2) {
                page1.classList.add('flipped');
                page2.classList.add('flipped');
            }

            // Bật/tắt nút bấm tùy vào trạng thái
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === 2);
            
            // Thay đổi text nút cho hợp lý
            if(currentState === 0) {
                btnNext.innerHTML = 'Mở thiệp <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
            } else if (currentState === 1) {
                btnNext.innerHTML = 'Xem mặt sau <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
                btnPrev.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> Đóng thiệp';
            } else {
                btnPrev.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> Mở thiệp';
            }
        }

        function turnNext() {
            if (currentState < 2) {
                currentState++;
                updateUI();
            }
        }

        function turnPrev() {
            if (currentState > 0) {
                currentState--;
                updateUI();
            }
        }

        function returnToContent() {
            // Từ trang cuối quay lại trang nội dung chính
            currentState = 1;
            updateUI();
        }

        function startExperience() {
            // Ẩn màn hình chào
            document.getElementById('introScreen').classList.add('hidden');
            // Hiện nội dung thiệp với animation pop-up mượt mà
            document.getElementById('mainContent').classList.add('visible');
        }

        // Khởi tạo giao diện ban đầu
        updateUI();
    </script>
